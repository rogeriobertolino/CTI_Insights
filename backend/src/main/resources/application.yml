server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 20MB
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cti_insights}
    username: ${DATABASE_USER:cti}
    password: ${DATABASE_PASSWORD:cti}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
management:
  endpoints.web.exposure.include: health,info
cti:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:cti-insights}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:1800}
  python:
    mode: ${PYTHON_MODE:native}
    image: ${PYTHON_IMAGE:cti-insights-analytics:local}
    executable: ${PYTHON_EXECUTABLE:python}
    script: ${PYTHON_SCRIPT:../python/analyze.py}
    timeout-seconds: ${PYTHON_TIMEOUT_SECONDS:120}
  cors:
    origin: ${CORS_ORIGIN:http://localhost:5173}
