server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.max-swallow-size=20MB
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cti_insights}
spring.datasource.username=${DATABASE_USER:cti}
spring.datasource.password=${DATABASE_PASSWORD:cti}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
management.endpoints.web.exposure.include=health,info
cti.jwt.secret-base64=${JWT_SECRET_BASE64:}
cti.jwt.issuer=${JWT_ISSUER:cti-insights}
cti.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}
cti.python.mode=${PYTHON_MODE:native}
cti.python.image=${PYTHON_IMAGE:cti-insights-analytics:local}
cti.python.executable=${PYTHON_EXECUTABLE:python}
cti.python.script=${PYTHON_SCRIPT:../python/analyze.py}
cti.python.timeout-seconds=${PYTHON_TIMEOUT_SECONDS:120}
cti.cors.origin=${CORS_ORIGIN:http://localhost:5173}
